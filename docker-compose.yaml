services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5173:5173"
    networks:
      - poc-net
    volumes:
      - ./frontend:/app
    environment:
      - VITE_HOST=localhost
      - VITE_PORT=5173
      - VITE_MQTT_HOST=localhost
      - VITE_MQTT_PORT=9001
      - VITE_MQTT_USERNAME=admin
      - VITE_MQTT_PASSWORD=123456
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  mqtt-dashboard:
    image: ghcr.io/jmischler72/mqtt-dashboard:latest
    container_name: mqtt-dashboard
    ports:
      - "8088:8080"
    networks:
      - poc-net
    volumes:
      - ./data/mqtt-dashboard:/app/data
    depends_on:
      - mosquitto
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  esphome:
    container_name: esphome
    image: esphome-riscv
    ports:
      - "6052:6052"
    build: 
      context: ./esphome
      dockerfile: Dockerfile
    volumes:
      - ./esphome/data/config:/config
      - /dev:/dev
    networks:
      - poc-net
    restart: unless-stopped
    privileged: true

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "1883:1883"
      - "8883:8883"
      - "8084:8084"
      - "9001:9001"
    volumes:
      - ./data/mosquitto:/mosquitto/
    networks:
      - poc-net
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "$$SYS/broker/version", "-C", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

networks:
  poc-net:
    name: poc-net
    driver: bridge